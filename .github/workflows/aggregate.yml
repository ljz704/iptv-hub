name: aggregate-tv-sources

on:
  schedule:
    # 每 6 小时跑一次（UTC）
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      no_probe:
        description: "跳过健康探测（快速预览）"
        type: boolean
        default: false

# 允许 Action 提交结果
permissions:
  contents: write

concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行聚合
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ "${{ inputs.no_probe }}" = "true" ]; then
            python -m iptvhub.cli --out dist --no-probe
          else
            # --deep: 下载真实分片验证，能筛掉"播放列表在但分片已删"的假活源
            python -m iptvhub.cli --out dist --deep
          fi
        continue-on-error: true

      - name: 重建 m3u（TVBox 故障转移格式）
        run: |
          # 关键：把同名频道重复列出，让 TVBox 能自动做故障转移。
          # 不要用只有单个源 + 自定义 FALLBACK 标签的旧格式，
          # TVBox 不认识该标签，主源挂了频道就彻底看不了。
          python build_live_m3u.py

      - name: 重建 TVBox 配置
        run: |
          # 补上实测可用的点播源与 spider 镜像，
          # 并把直播地址指向 live.m3u（而非 live_multi.m3u）。
          python build_tvbox_config.py

      - name: 生成多镜像冗余配置
        run: |
          # 同一份配置生成 4 个镜像地址，某个镜像挂了可换下一个。
          # 实测各镜像可用性随时变化（github.io 完全不通，raw 时通时不通）。
          python build_redundant_config.py

      - name: 统计结果
        run: |
          echo "=== 输出文件 ==="
          ls -lh dist/ || true
          echo "=== 频道统计 ==="
          cat dist/stats.json 2>/dev/null || echo "无 stats.json"

      - name: 提交更新
        run: |
          git config user.name  "tv-source-bot"
          git config user.email "tv-source-bot@users.noreply.github.com"
          git add dist/ data/history.jsonl 2>/dev/null || git add dist/
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "chore: 刷新直播源 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: tv-sources
          path: dist/
          retention-days: 7
